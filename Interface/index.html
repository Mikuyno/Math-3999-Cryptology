<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="../Ciphers/Cipher.js"></script>
</head>

<body>
    <h1>Welcome to the Cipher Interface</h1>
    <div class="StartSection">
        <input type="text" id="inputText" placeholder="Enter text to encrypt">
        <label for="cipherSelect">Choose a cipher:</label>
        <select id="cipherSelect">
            <option value="" selected disabled hidden>Select a cipher</option>
            <option value="ceasar">Ceasar Cipher</option>
            <option value="vigenère">Vigenère Cipher</option>
            <option value="affine">Affine Cipher</option>
            <!-- Add more cipher options here -->
        </select>
    </div>
    <div class="CipherContainer">
        <div id="ceasar">
            <h2>Ceasar Cipher</h2>
            <input type="number" id="shiftValue" placeholder="Enter shift value">
            <button onclick="encryptCeasarCipher()">Encrypt</button>
            <button onclick="decryptCeasarCipher()">Decrypt</button>
        </div>
        <div id="vigenère">
            <h2>Vigenère Cipher</h2>
            <input type="text" id="key" placeholder="Enter key">
            <button onclick="encryptVigenereCipher()">Encrypt</button>
            <button onclick="decryptVigenereCipher()">Decrypt</button>
        </div>
        <div id="affine">
            <h2>Affine Cipher</h2>
            <input type="number" id="kValue" placeholder="Enter 'k' value">
            <input type="number" id="bValue" placeholder="Enter 'b' value">
            <button onclick="encryptAffineCipher()">Encrypt</button>
        </div>
        <p id="result"></p>
    </div>
</body>

</html>
