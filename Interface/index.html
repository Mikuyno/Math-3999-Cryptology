<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cipher Interface</title>
    <link rel="stylesheet" href="style.css">
    <script src="../Ciphers/affineCipher.js"></script>
    <script src="../Ciphers/blockCipher.js"></script>
    <script src="../Ciphers/ceasarCipher.js"></script>
    <script src="../Ciphers/hillCipher.js"></script>
    <script src="../Ciphers/vigenereCipher.js"></script>
    <script src="choiceMenu.js"></script>
</head>

<body>
    <h1>Welcome to the Cipher Interface</h1>
    <div class="StartSection">
        <input type="text" id="inputText" placeholder="Enter text to encrypt">
        <label for="cipherSelect">Choose a cipher:</label>
        <select id="cipherSelect">
            <option value="" selected disabled hidden>Select a cipher</option>
            <option value="ceasar">Ceasar Cipher</option>
            <option value="vigenère">Vigenère Cipher</option>
            <option value="affine">Affine Cipher</option>
            <option value="hill">Hill Cipher</option>
            <option value="block">Block Cipher</option>
            <!-- Add more cipher options here -->
        </select>
    </div>
    <div class="CipherContainer">
        <div id="ceasar">
            <h2>Ceasar Cipher</h2>
            <input type="number" id="shiftValue" placeholder="Enter shift value">
            <button onclick="encryptCeasarCipher()">Encrypt</button>
            <button onclick="decryptCeasarCipher()">Decrypt</button>
        </div>
        <div id="vigenère">
            <h2>Vigenère Cipher</h2>
            <input type="text" id="key" placeholder="Enter key">
            <button onclick="encryptVigenereCipher()">Encrypt</button>
            <button onclick="decryptVigenereCipher()">Decrypt</button>
        </div>
        <div id="affine">
            <h2>Affine Cipher</h2>
            <input type="number" id="kValue" placeholder="Enter 'k' value">
            <input type="number" id="bValue" placeholder="Enter 'b' value">
            <button onclick="encryptAffineCipher()">Encrypt</button>
            <button onclick="decryptAffineCipher()">Decrypt</button>
        </div>
        <div id="hill">
            <h2>Hill Cipher</h2>
            <input type="text" id="keyMatrix"
                placeholder="Enter key matrix with semicolons separating matrix rows (e.g., GCD;DCA)">
            <button onclick="encryptHillCipher()">Encrypt</button>
            <button onclick="decryptHillCipher()">Decrypt</button>
        </div>
        <div id="block">
            <h2>Block Cipher</h2>
            <input type="text" id="blockKey" placeholder="Enter block cipher key">
            <button onclick="encryptBlockCipher()">Encrypt</button>
            <button onclick="decryptBlockCipher()">Decrypt</button>
        </div>
        <!-- Add more cipher sections here -->
        <p id="result"></p>
    </div>
</body>

</html>
